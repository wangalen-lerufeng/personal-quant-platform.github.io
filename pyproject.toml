[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-quant-platform"
version = "0.1.0"
description = "Market-agnostic personal quant trading platform core"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "certifi>=2024.2.2", "requests>=2.31", "lightgbm>=4.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
